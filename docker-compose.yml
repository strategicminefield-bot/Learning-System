version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: learning-fabric-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Data is preserved in the external volume learning-fabric-postgres-data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - learning-fabric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabric}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: learning-fabric-api:1.0.6
    container_name: learning-fabric-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fabric@postgres:5432/learning_fabric}
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - learning-fabric
    volumes:
      - ./fabric/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/alive').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    external: true
    name: learning-fabric-postgres-data

networks:
  learning-fabric:
    driver: bridge
    external: true
